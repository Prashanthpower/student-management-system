
spring.application.name=student-management-system

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/student_management;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:StudentManagementSystemSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://student-management-frontend-svvd.onrender.com}

# Administrator Account Credentials
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@studentmanagement.com}
app.admin.default-password=${ADMIN_PASSWORD:${ADMIN_DEFAULT_PASSWORD:Admin@123}}
app.admin.sync-password-from-env=${ADMIN_SYNC_PASSWORD:false}
