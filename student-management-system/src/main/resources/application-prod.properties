# ===================================================================
# Production Environment Configuration (spring.profiles.active=prod)
# ===================================================================

# Database (PostgreSQL / Production DB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Strict Production Security: Secrets MUST be provided via Environment Variables
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Production Admin Credentials
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@studentmanagement.com}
app.admin.default-password=${ADMIN_PASSWORD}
app.admin.sync-password-from-env=${ADMIN_SYNC_PASSWORD:true}
